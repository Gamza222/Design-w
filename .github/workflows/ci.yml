name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  VITE_SITE_URL: https://designseichas.ru

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deploy:
    name: Deploy to REG.RU over FTPS
    needs: [quality, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://designseichas.ru
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'server173.hosting.reg.ru' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '21' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/www/designseichas.ru' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_FTP_CERT_SHA1: ${{ vars.DEPLOY_FTP_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check deployment configuration
        env:
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_FTP_PASSWORD" || -z "$DEPLOY_FTP_CERT_SHA1" ]]; then
            echo "FTPS deployment settings are not configured" >&2
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" || "$DEPLOY_PATH" == "/" ]]; then
            echo "Unsafe deployment path" >&2
            exit 1
          fi

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Verify REG.RU FTPS certificate
        run: |
          certificate="$RUNNER_TEMP/reg-ru-ftps.pem"
          openssl s_client \
            -connect "$DEPLOY_HOST:$DEPLOY_PORT" \
            -servername "$DEPLOY_HOST" \
            -starttls ftp \
            -showcerts </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > "$certificate"

          observed_sha1="$(openssl x509 -in "$certificate" -noout -fingerprint -sha1 | sed 's/.*=//' | tr '[:lower:]' '[:upper:]')"
          expected_sha1="$(printf '%s' "$DEPLOY_FTP_CERT_SHA1" | tr '[:lower:]' '[:upper:]')"
          if [[ "$observed_sha1" != "$expected_sha1" ]]; then
            echo "Unexpected FTPS certificate fingerprint: $observed_sha1" >&2
            exit 1
          fi

          chmod 600 "$certificate"
          echo "DEPLOY_FTP_CA_FILE=$certificate" >> "$GITHUB_ENV"

      - name: Upload static site
        env:
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: |
          lftp -u "$DEPLOY_USER","$DEPLOY_FTP_PASSWORD" -p "$DEPLOY_PORT" "$DEPLOY_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:ca-file "$DEPLOY_FTP_CA_FILE"
          set ssl:check-hostname yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose=1 --parallel=4 \
            --exclude='^\.well-known(/|$)' \
            build/client/ "$DEPLOY_PATH/"
          cls -l "$DEPLOY_PATH/index.html"
          cls -l "$DEPLOY_PATH/sitemap.xml"
          cls -l "$DEPLOY_PATH/404.html"
          bye
          LFTP
